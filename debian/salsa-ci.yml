---
# Include Salsa-CI as a base
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/-/raw/master/recipes/ubuntu.yml

variables:
  # These pass in Ubuntu 24.10 "Oracluar", so continue testing that they don't regress
  SALSA_CI_DISABLE_LINTIAN: 0
  RELEASE: oracular

.build-package:
  # Extend Salsa-CI build jobs to have longer timeout as the default GitLab
  # timeout (1h) is often not enough
  timeout: 3h
