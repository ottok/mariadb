---
# Include Salsa CI as a base
#
# Revert back to version prior to Sept 11th as the MariaDB builds never went
# past ~90% with the new sbuild based system, it is too slow. Switch back to
# default Ubuntu recipie once this is fixed:
# https://salsa.debian.org/salsa-ci-team/pipeline/-/issues/507
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/-/raw/59e55e8cf51542bd8f72f08d61a78280b043672d/salsa-ci.yml
  - https://salsa.debian.org/salsa-ci-team/pipeline/-/raw/59e55e8cf51542bd8f72f08d61a78280b043672d/pipeline-jobs.yml
  - https://salsa.debian.org/salsa-ci-team/pipeline/-/raw/59e55e8cf51542bd8f72f08d61a78280b043672d/vars/ubuntu.yml

variables:
  # These pass in Ubuntu 25.04 "Plucky", so continue testing to ensure they
  # don't regress
  SALSA_CI_DISABLE_LINTIAN: 0
  RELEASE: plucky

.build-package:
  # Extend Salsa CI build jobs to have longer timeout as the default GitLab
  # timeout (1h) is often not enough
  timeout: 3h
  # Default 5G sporadically fails builds on not having enough disk space
  variables:
    CCACHE_MAXSIZE: 3G
  # Salsa instance runners typically have 30G volumes with 14G free disk space
  before_script:
    - echo "Total and free disk space:"
    - df -h .
