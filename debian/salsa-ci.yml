---
# Include Salsa-CI as a base
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/-/raw/master/recipes/ubuntu.yml

variables:
  # These pass in Ubuntu 22.04 "Jammy", so continue testing that they don't regress
  SALSA_CI_DISABLE_LINTIAN: 0
  # Testing https://salsa.debian.org/salsa-ci-team/pipeline#git-attributes
  SALSA_CI_DISABLE_GBP_SETUP_GITATTRIBUTES: 1
  # The directory https://archive.mariadb.org/mariadb-11.8/source/ only contains
  # the sources of the latest MariaDB release, and thus running uscan for past
  # releases will always fail, and thus uscan job should be disabled on Salsa CI
  SALSA_CI_DISABLE_USCAN: 1

# Extend Salsa-CI build jobs to have longer timeout as the default GitLab
# timeout (1h) is often not enough
.build-package:
  timeout: 3h
